apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: employee-virtualservice
  namespace: app-dev
spec:
  hosts:
    - "*"
  gateways:
    - employee-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: frontend-service.app-dev.svc.cluster.local
            port:
              number: 80
