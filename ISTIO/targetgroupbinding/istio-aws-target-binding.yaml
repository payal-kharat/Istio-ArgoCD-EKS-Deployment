apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-aws-target-binding
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/payal-kharat/Istio-ArgoCD-EKS-Deployment.git
    targetRevision: main
    path: ISTIO/targetgroupbinding
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
