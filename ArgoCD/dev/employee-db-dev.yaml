
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-db-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/payal-kharat/Istio-ArgoCD-EKS-Deployment.git
    targetRevision: main
    path: Helm
    helm:
      valueFiles:
        - values-dev.yaml
      parameters:
        - name: components.frontend.enabled
          value: "false"
        - name: components.backend.enabled
          value: "false"
        - name: components.mysql.enabled
          value: "true"
        - name: configMap.enabled
          value: "true"
        - name: secret.enabled
          value: "true"
        - name: ingress.enabled
          value: "false"
        - name: storageClass.enabled
          value: "true"

  destination:
    server: https://6D5738BE9D5DE4304CD29BFDA541F0F9.gr7.us-east-1.eks.amazonaws.com
    namespace: app-dev

  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
