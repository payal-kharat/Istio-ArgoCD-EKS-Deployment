
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-db-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/payal-kharat/Istio-ArgoCD-EKS-Deployment.git
    targetRevision: main
    path: Helm
    helm:
      valueFiles:
        - values-dev.yaml
      parameters:
        - name: components.frontend.enabled
          value: "false"
        - name: components.backend.enabled
          value: "false"
        - name: components.mysql.enabled
          value: "true"
        - name: configMap.enabled
          value: "true"
        - name: secret.enabled
          value: "true"
        - name: ingress.enabled
          value: "false"
        - name: storageClass.enabled
          value: "true"
  destination:
    server: arn:aws:eks:us-east-1:020048087135:cluster/employee-mgm-dev-cluster
    namespace: app-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
