apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: employee-config-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/payal-kharat/Istio-ArgoCD-EKS-Deployment.git
    targetRevision: main
    path: Helm

    helm:
      valueFiles:
        - values-dev.yaml

      parameters:
        - name: component
          value: config

  destination:
    server: https://6D5738BE9D5DE4304CD29BFDA541F0F9.gr7.us-east-1.eks.amazonaws.com
    namespace: app-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true