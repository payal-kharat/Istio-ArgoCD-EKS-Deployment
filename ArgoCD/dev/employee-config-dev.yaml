apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: employee-config-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/payal-kharat/Istio-ArgoCD-EKS-Deployment.git
    targetRevision: main
    path: Helm

    helm:
      valueFiles:
        - values-dev.yaml

      parameters:
        - name: component
          value: config

  destination:
    server: https://kubernetes.default.svc
    namespace: app-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true